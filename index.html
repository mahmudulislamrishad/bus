<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bangladesh Bus Simulator — Phase 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu"><div class="panel"><h1>BANGLADESH BUS SIMULATOR</h1><p>Phase 1 · Playable Prototype</p><button id="play">START DRIVE</button><p class="hint">Landscape recommended · Touch controls supported</p></div></div>
<div id="hud"><div id="speed">0 <small>KM/H</small></div><div id="gear">D</div><button id="camera">CAMERA</button><button id="pause">Ⅱ</button></div>
<div id="controls"><button id="left" class="steer">◀</button><button id="right" class="steer">▶</button><button id="brake">BRAKE</button><button id="gas">ACCEL</button><button id="reverse">REV</button><button id="horn">HORN</button></div>
<div id="paused" class="hidden"><div class="panel"><h2>PAUSED</h2><button id="resume">RESUME</button><button id="restart">RESTART</button></div></div>
<script type="module" src="src/main.js"></script>
</body></html>
