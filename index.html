<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Zahid Coach/nBangladesh Bus Simulator</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}

#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));text-shadow:0 1px 4px #000a;pointer-events:none}
#spd{font-size:clamp(34px,10vmin,64px);font-weight:700;line-height:1}
#hud small{font-size:14px;opacity:.8;margin-left:4px}
#gear{font-size:clamp(18px,5vmin,28px);font-weight:700;margin-top:2px}
#rpmbar{width:clamp(110px,28vmin,180px);height:8px;background:#fff3;border-radius:4px;margin-top:6px;overflow:hidden}
#rpm{display:block;height:100%;width:0;background:#4cd964}
#camlabel{position:fixed;top:12%;left:50%;transform:translateX(-50%);padding:4px 12px;background:#0008;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
#camlabel.show{opacity:1}

.top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:10px}

.btn{display:flex;align-items:center;justify-content:center;padding:0;font:700 clamp(13px,3.4vmin,20px) system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45);border-radius:18px;touch-action:none}
.btn.on{background:rgba(255,255,255,.42)}
.sq{width:clamp(56px,17vmin,96px);height:clamp(56px,17vmin,96px)}
.tall{width:clamp(60px,17vmin,96px);height:clamp(110px,30vmin,170px)}
.mini{width:clamp(42px,11vmin,60px);height:clamp(42px,11vmin,60px);border-radius:50%}
.gas{background:rgba(76,217,100,.28)}
.brake{background:rgba(255,69,58,.28)}

#controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#controls .grp{display:flex;gap:2.5vmin;align-items:flex-end;pointer-events:auto}

#menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:linear-gradient(#0b3d2e,#06201a)}
#menu h1{margin:0;font-size:clamp(24px,7vmin,44px)}
#menu p{margin:0;max-width:85%;opacity:.75;font-size:13px;line-height:1.5}
#play{font:700 22px system-ui,sans-serif;padding:14px 48px;border:0;border-radius:30px;background:#f42a41;color:#fff}

#rotate{display:none;position:fixed;inset:0;z-index:20;background:#000;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}
@media (orientation:portrait){#rotate{display:flex}}
</style>

</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div><span id="spd">0</span><small>km/h</small></div>
  <div id="gear">N</div>
  <div id="rpmbar"><i id="rpm"></i></div>
</div>
<div id="camlabel"></div>

<div class="top">
  <button class="btn mini" data-act="reset" aria-label="Reset">⟲</button>
  <button class="btn mini" data-act="camera" aria-label="Camera">📷</button>
  <button class="btn mini" id="fs" aria-label="Fullscreen">⛶</button>
</div>

  <div class="grp">
    <button class="btn sq" data-key="left">◀</button>
    <button class="btn sq" data-key="right">▶</button>
  </div>
  <div class="grp">
    <button class="btn mini" data-key="handbrake">HB</button>
    <button class="btn mini" data-key="reverse">R</button>
    <button class="btn sq brake" data-key="brake">BRAKE</button>
    <button class="btn tall gas" data-key="gas">GAS</button>
  </div>
</div>

<div id="menu">
  <h1>Bangladesh Bus Simulator</h1>
  <button id="play">PLAY</button>
  <p>Touch: ◀ ▶ steer · GAS · BRAKE · R reverse · HB handbrake · 📷 camera<br>
     Keyboard: WASD/arrows · Shift brake · Space handbrake · C camera</p>
</div>

<div id="rotate">Rotate your phone to landscape</div>

<script>
try{(function(){
// ---- environment/World

// Phase 1 world: one long main road (Z axis) + one cross road (X axis at z = CROSS_Z).
// Everything is built from InstancedMesh batches to keep draw calls low.
// Extend later by adding "sections" that push meshes + colliders the same way.
const CROSS_Z = 150;
const ROAD_W = 9;

function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function noiseTexture(r, g, b, spread, repX, repY) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), img = x.createImageData(128, 128), rand = rng(7);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (rand() - 0.5) * spread;
    img.data[i] = r + n; img.data[i + 1] = g + n; img.data[i + 2] = b + n; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return t;
}

class World {
  constructor(scene) {
    this.scene = scene;
    this.colliders = [];
    this.bounds = { x: 290, z: 580 };
    this.rand = rng(1234);
    this.buildGround();
    this.buildRoads();
    this.buildBuildings();
    this.buildTrees();
  }

  plane(w, l, mat, x, y, z, rotY = 0) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l).rotateX(-Math.PI / 2), mat);
    m.position.set(x, y, z); m.rotation.y = rotY; this.scene.add(m); return m;
  }

  buildGround() {
    const mat = new THREE.MeshLambertMaterial({ map: noiseTexture(86, 130, 60, 30, 180, 180) });
    this.plane(1600, 1600, mat, 0, 0, 0);
  }

  buildRoads() {
    const asphalt = (rx, ry) => new THREE.MeshLambertMaterial({ map: noiseTexture(58, 58, 62, 22, rx, ry), polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
    this.plane(ROAD_W, 1200, asphalt(1, 150), 0, 0.06, 0);
    this.plane(600, ROAD_W, asphalt(75, 1), 0, 0.12, CROSS_Z);

    const white = new THREE.MeshBasicMaterial({ color: 0xeeeeee, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    const yellow = new THREE.MeshBasicMaterial({ color: 0xf2c200, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    const edge = ROAD_W / 2 - 0.4;
    // edge lines, split at the junction
    for (const s of [-1, 1]) {
      this.plane(0.15, 590 + CROSS_Z - 8, white, s * edge, 0.18, (-600 + CROSS_Z - 8) / 2);
      this.plane(0.15, 600 - CROSS_Z - 8, white, s * edge, 0.18, (CROSS_Z + 8 + 600) / 2);
    }
    for (const s of [-1, 1]) {
      this.plane(292 - 8, 0.15, white, (s * (300 + 8)) / 2, 0.18, CROSS_Z + edge);
      this.plane(292 - 8, 0.15, white, (s * (300 + 8)) / 2, 0.18, CROSS_Z - edge);
    }
    // dashed centre lines (instanced)
    const dash = new THREE.InstancedMesh(new THREE.BoxGeometry(0.2, 0.02, 3), yellow, 300);
    const m = new THREE.Matrix4(); let n = 0;
    for (let z = -590; z < 590; z += 9) {
      if (Math.abs(z - CROSS_Z) < 8) continue;
      dash.setMatrixAt(n++, m.makeTranslation(0, 0.18, z));
    }
    for (let x = -290; x < 290; x += 9) {
      if (Math.abs(x) < 8) continue;
      dash.setMatrixAt(n++, m.makeRotationY(Math.PI / 2).setPosition(x, 0.18, CROSS_Z));
    }
    dash.count = n; this.scene.add(dash);
  }

  addCollider(x, z, hw, hd) { this.colliders.push({ minX: x - hw, maxX: x + hw, minZ: z - hd, maxZ: z + hd }); }

  buildBuildings() {
    const R = this.rand, list = [];
    const place = (x, z, w, d, h) => { list.push({ x, z, w, d, h }); this.addCollider(x, z, w / 2, d / 2); };
    for (let z = -560; z < 560; z += 16 + R() * 14) {
      if (Math.abs(z - CROSS_Z) < 16) continue;
      for (const s of [-1, 1]) {
        if (R() < 0.25) continue;
        const w = 6 + R() * 6, d = 7 + R() * 5, h = 4 + R() * 5;
        place(s * (ROAD_W / 2 + 3 + w / 2 + R() * 4), z, w, d, h);
      }
    }
    // along the cross road
    for (let x = -280; x < 280; x += 18 + R() * 12) {
      if (Math.abs(x) < 16) continue;
      for (const s of [-1, 1]) {
        if (R() < 0.35) continue;
        const w = 7 + R() * 5, d = 6 + R() * 5, h = 4 + R() * 4;
        place(x, CROSS_Z + s * (ROAD_W / 2 + 3 + d / 2 + R() * 3), w, d, h);
      }
    }
    this.buildingList = list;

    const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0), new THREE.MeshLambertMaterial({ color: 0xffffff }), list.length);
    const roofs = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0), new THREE.MeshLambertMaterial({ color: 0x8a8f94 }), list.length);
    const pal = [0xe8d9a8, 0xd9a066, 0x9bc4a0, 0xcf7a6a, 0xa8c0d8, 0xefe6d0, 0xd8c35a];
    const m = new THREE.Matrix4(), col = new THREE.Color(), pos = new THREE.Vector3(), sc = new THREE.Vector3(), q = new THREE.Quaternion();
    list.forEach((b, i) => {
      m.compose(pos.set(b.x, 0, b.z), q, sc.set(b.w, b.h, b.d)); walls.setMatrixAt(i, m);
      walls.setColorAt(i, col.setHex(pal[Math.floor(R() * pal.length)]));
      m.compose(pos.set(b.x, b.h, b.z), q, sc.set(b.w + 0.6, 0.25, b.d + 0.6)); roofs.setMatrixAt(i, m);
    });
    this.scene.add(walls, roofs);
  }

  buildTrees() {
    const R = this.rand, pts = [];
    const nearBuilding = (x, z) => this.buildingList.some((b) => Math.abs(x - b.x) < b.w / 2 + 2 && Math.abs(z - b.z) < b.d / 2 + 2);
    const ok = (x, z) => Math.abs(x) > 7 && Math.abs(z - CROSS_Z) > 7 && !nearBuilding(x, z);
    for (let i = 0; i < 700 && pts.length < 380; i++) {
      let x, z;
      if (i % 4 === 0) { x = (R() - 0.5) * 560; z = CROSS_Z + (R() - 0.5) * 120; }
      else { x = (R() - 0.5) * 160; z = (R() - 0.5) * 1160; }
      if (ok(x, z)) pts.push([x, z, 0.8 + R() * 0.7]);
    }
    const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.2, 0.3, 3, 6).translate(0, 1.5, 0), new THREE.MeshLambertMaterial({ color: 0x5b4030 }), pts.length);
    const crowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2, 0).translate(0, 4.2, 0), new THREE.MeshLambertMaterial({ color: 0xffffff }), pts.length);
    const m = new THREE.Matrix4(), col = new THREE.Color(), pos = new THREE.Vector3(), sc = new THREE.Vector3(), q = new THREE.Quaternion();
    pts.forEach(([x, z, s], i) => {
      m.compose(pos.set(x, 0, z), q, sc.set(s, s, s));
      trunks.setMatrixAt(i, m); crowns.setMatrixAt(i, m);
      crowns.setColorAt(i, col.setHSL(0.27 + R() * 0.06, 0.5, 0.22 + R() * 0.12));
      this.addCollider(x, z, 0.35 * s, 0.35 * s);
    });
    this.scene.add(trunks, crowns);
  }
}

// ---- bus/BusPhysics
// Pure physics (no Three.js). Units: metres, seconds, radians.
// Convention: heading 0 faces +Z; positive heading turns LEFT; steer > 0 = right.

const WHEELBASE = 5.5;
const GEAR_ACC = [0, 2.6, 1.9, 1.4, 1.0, 0.8];      // m/s^2 at full throttle, index = gear
const UP_SHIFT = [0, 4.0, 8.5, 13.0, 16.5];          // m/s: gear n -> n+1
const V_MAX = 26;                                    // ~94 km/h governor
const MAX_LAT_ACC = 4.0;                             // grip limit (m/s^2)

class BusPhysics {
  constructor() { this.reset(); }

  reset(x = 2.5, z = -450, heading = 0) {
    this.x = x; this.z = z; this.heading = heading;
    this.speed = 0;          // signed, m/s along heading
    this.steer = 0;          // current road-wheel angle
    this.thr = 0; this.brk = 0;
    this.gear = 1; this.shiftTimer = 0;
    this.rpm = 0.15;         // 0..1
    this.pitch = 0; this.pitchV = 0; this.roll = 0; this.rollV = 0;
    this.longAcc = 0; this.latAcc = 0;
    this.braking = false;
    this.wheelSpin = 0;
  }

  get kmh() { return Math.abs(this.speed) * 3.6; }

  update(dt, inp) {
    const v0 = this.speed;
    let v = v0;
    const reverse = inp.reverse;

    // smoothed pedals (no instant response)
    this.thr += ((inp.gas ? 1 : 0) - this.thr) * Math.min(1, dt * 3);
    this.brk += ((inp.brake ? 1 : 0) - this.brk) * Math.min(1, dt * 6);

    // automatic gearbox with shift lockout
    if (!reverse) {
      const a = Math.abs(v);
      if (this.shiftTimer <= 0) {
        if (this.gear < 5 && a > UP_SHIFT[this.gear]) { this.gear++; this.shiftTimer = 0.45; }
        else if (this.gear > 1 && a < UP_SHIFT[this.gear - 1] * 0.8) { this.gear--; this.shiftTimer = 0.3; }
      }
    } else this.gear = 1;
    this.shiftTimer = Math.max(0, this.shiftTimer - dt);

    // drive
    let drive = 0;
    if (this.thr > 0.01 && this.shiftTimer <= 0) {
      if (!reverse) {
        drive = GEAR_ACC[this.gear] * this.thr * Math.max(0, 1 - (v / V_MAX) ** 2);
      } else if (v > 0.3) {
        drive = -3 * this.thr;                        // can't engage reverse while rolling forward: acts as brake
      } else {
        drive = -1.3 * this.thr * Math.max(0, 1 - Math.abs(v) / 6);
      }
    }
    v += drive * dt;

    // resistance: rolling + drag + engine braking + brakes
    let res = 0.12 + 0.0009 * v * v;
    if (this.thr < 0.05) res += 0.25;
    res += 5 * this.brk + (inp.handbrake ? 4.5 : 0);
    const dv = res * dt;
    if (Math.abs(v) <= dv) v = 0; else v -= Math.sign(v) * dv;
    this.speed = v;
    this.braking = this.brk > 0.1 || inp.handbrake;

    // steering: speed-dependent lock, gradual rate
    const a = Math.abs(v);
    const maxSteer = 0.62 / (1 + 0.09 * a);
    const target = ((inp.right ? 1 : 0) - (inp.left ? 1 : 0)) * maxSteer;
    const rate = target === 0 ? 1.8 : 0.9;
    const d = target - this.steer;
    this.steer += Math.sign(d) * Math.min(Math.abs(d), rate * dt);
    if (Math.abs(this.steer) > maxSteer) this.steer = Math.sign(this.steer) * maxSteer;

    // bicycle model + grip limit (understeer at speed)
    let yaw = -(v / WHEELBASE) * Math.tan(this.steer);
    if (a > 1) {
      const lim = MAX_LAT_ACC / a;
      yaw = Math.max(-lim, Math.min(lim, yaw));
    }
    this.heading += yaw * dt;
    this.x += Math.sin(this.heading) * v * dt;
    this.z += Math.cos(this.heading) * v * dt;
    this.wheelSpin += v * dt / 0.5;

    // body motion: spring-damper pitch/roll from accelerations
    const accel = dt > 0 ? (v - v0) / dt : 0;
    this.longAcc += (accel - this.longAcc) * Math.min(1, dt * 5);
    this.latAcc += (v * yaw - this.latAcc) * Math.min(1, dt * 5);
    const pT = -this.longAcc * 0.006, rT = this.latAcc * 0.012;
    this.pitchV += (30 * (pT - this.pitch) - 5 * this.pitchV) * dt; this.pitch += this.pitchV * dt;
    this.rollV += (30 * (rT - this.roll) - 5 * this.rollV) * dt; this.roll += this.rollV * dt;

    // RPM (normalised): rises through each gear, revs with throttle when slow
    const lo = this.gear > 1 ? UP_SHIFT[this.gear - 1] * 0.8 : 0;
    const hi = this.gear < 5 ? UP_SHIFT[this.gear] : V_MAX;
    const base = 0.25 + 0.6 * Math.min(1, Math.max(0, (a - lo) / (hi - lo)));
    const rpmT = Math.max(base, 0.15 + 0.5 * this.thr * (a < 1 ? 1 : 0.4));
    this.rpm += (rpmT - this.rpm) * Math.min(1, dt * 6);
  }

  // Bus approximated by 3 circles; colliders are AABBs {minX,maxX,minZ,maxZ}.
  collide(colliders, bounds) {
    const R = 1.4, OFF = [3.6, 0, -3.6];
    for (let pass = 0; pass < 2; pass++) {
      const sx = Math.sin(this.heading), cz0 = Math.cos(this.heading);
      for (const off of OFF) {
        let cx = this.x + sx * off, cz = this.z + cz0 * off;
        for (const c of colliders) {
          if (cx < c.minX - R || cx > c.maxX + R || cz < c.minZ - R || cz > c.maxZ + R) continue;
          const px = Math.max(c.minX, Math.min(cx, c.maxX));
          const pz = Math.max(c.minZ, Math.min(cz, c.maxZ));
          let dx = cx - px, dz = cz - pz;
          const d2 = dx * dx + dz * dz;
          if (d2 >= R * R) continue;
          let d = Math.sqrt(d2);
          if (d < 1e-4) { dx = 1; dz = 0; d = 0; } else { dx /= d; dz /= d; }
          const push = R - d;
          this.x += dx * push; this.z += dz * push; cx += dx * push; cz += dz * push;
          if (this.speed * (sx * dx + cz0 * dz) < 0) this.speed *= 0.7;
        }
      }
    }
    if (Math.abs(this.x) > bounds.x) { this.x = Math.sign(this.x) * bounds.x; this.speed *= 0.7; }
    if (Math.abs(this.z) > bounds.z) { this.z = Math.sign(this.z) * bounds.z; this.speed *= 0.7; }
  }
}

// ---- bus/Bus

// Placeholder procedural bus. Front faces +Z. Replace by loading a GLB and
// keeping the same public members: root, body, wheels[], frontWheels[], brakeLights, headLights.
function destinationBoard() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 40;
  const g = c.getContext('2d');
  g.fillStyle = '#111'; g.fillRect(0, 0, 256, 40);
  g.fillStyle = '#ffb000'; g.font = 'bold 26px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('ঢাকা ⇄ চট্টগ্রাম', 128, 22);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  return new THREE.MeshBasicMaterial({ map: t });
}

class Bus {
  constructor() {
    this.root = new THREE.Group();
    this.body = new THREE.Group();
    this.root.add(this.body);

    const L = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
    const green = L(0x1f7a3d), red = L(0xc8102e), cream = L(0xf1ead2), dark = L(0x222222), grey = L(0x555555);
    const glass = L(0x88aacc, { transparent: true, opacity: 0.28, depthWrite: false });
    const add = (geo, mat, x, y, z, parent = this.body) => {
      const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
    };
    const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);

    add(B(2.5, 0.9, 10.5), green, 0, 1.05, 0);              // lower body
    add(B(2.52, 0.2, 10.52), red, 0, 1.0, 0);               // stripe
    add(B(2.5, 0.3, 10.5), cream, 0, 3.35, 0);              // roof
    add(B(2.5, 1.7, 0.1), green, 0, 2.35, -5.2);            // rear wall
    for (const z of [-2.6, 0, 2.6, 4.95]) for (const s of [-1, 1]) add(B(0.1, 1.7, 0.18), cream, s * 1.22, 2.35, z);
    for (const s of [-1, 1]) add(B(0.1, 1.7, 0.12), cream, s * 1.2, 2.35, 5.2);
    for (const s of [-1, 1]) add(B(0.02, 1.5, 10.2), glass, s * 1.24, 2.35, 0);   // side glass
    add(B(2.4, 1.5, 0.02), glass, 0, 2.35, 5.22);                                  // windshield
    add(B(2.6, 0.3, 0.3), dark, 0, 0.7, 5.35);                                     // bumper
    add(B(2.6, 0.3, 0.3), dark, 0, 0.7, -5.35);
    for (const s of [-1, 1]) add(B(0.1, 0.4, 0.25), dark, s * 1.55, 2.5, 4.8);     // mirrors

    // driver area (driver sits on the right = -X; Bangladesh drives on the left)
    add(B(2.3, 0.5, 0.7), grey, 0, 1.75, 4.7);
    const wheelMesh = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.02, 8, 16), dark);
    wheelMesh.position.set(-0.7, 1.95, 4.15); wheelMesh.rotation.x = -1.0; this.body.add(wheelMesh);

    const board = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.26), destinationBoard());
    board.position.set(0, 3.35, 5.26); this.body.add(board);

    // lights
    this.headLights = L(0xffffee, { emissive: 0x555544 });
    this.brakeLights = L(0x550000, { emissive: 0x330000 });
    for (const s of [-1, 1]) {
      add(B(0.35, 0.2, 0.06), this.headLights, s * 0.85, 1.0, 5.28);
      add(B(0.3, 0.2, 0.06), this.brakeLights, s * 0.9, 1.0, -5.28);
    }

    // wheels (root-level so they don't roll with the body)
    this.wheels = []; this.frontWheels = [];
    const tyre = new THREE.CylinderGeometry(0.5, 0.5, 0.32, 16).rotateZ(Math.PI / 2);
    const tyreMat = L(0x151515), hubMat = L(0xbbbbbb);
    for (const [x, z, front] of [[1.28, 3.6, true], [-1.28, 3.6, true], [1.28, -3.4, false], [-1.28, -3.4, false]]) {
      const pivot = new THREE.Group(); pivot.position.set(x, 0.5, z);
      const spin = new THREE.Mesh(tyre, tyreMat);
      add(B(0.34, 0.12, 0.12), hubMat, 0, 0.32, 0, spin);   // marker so rotation is visible
      pivot.add(spin); this.root.add(pivot);
      this.wheels.push(spin); if (front) this.frontWheels.push(pivot);
    }

    // cheap blob shadow
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(3, 11), new THREE.MeshBasicMaterial({ color: 0, transparent: true, opacity: 0.35, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2; sh.position.y = 0.2; sh.renderOrder = 2; this.root.add(sh);
  }

  sync(p) {
    this.root.position.set(p.x, 0, p.z);
    this.root.rotation.y = p.heading;
    this.body.rotation.set(p.pitch, 0, p.roll);
    for (const w of this.wheels) w.rotation.x = p.wheelSpin;
    for (const f of this.frontWheels) f.rotation.y = -p.steer;
    this.brakeLights.emissive.setHex(p.braking ? 0xff1111 : 0x330000);
  }
}

// ---- game/InputManager
// Unified keyboard + touch input. Touch buttons carry data-key (held) or data-act (one-shot).
class InputManager {
  constructor(canvas) {
    this.state = { left: false, right: false, gas: false, brake: false, handbrake: false, reverse: false };
    this.look = { yaw: 0, pitch: 0, active: false };
    this.handlers = {};
    this.buttons = {};

    document.querySelectorAll('[data-key]').forEach((el) => {
      const key = el.dataset.key; this.buttons[key] = el;
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault(); el.setPointerCapture(e.pointerId);
        if (key === 'reverse') this.setKey('reverse', !this.state.reverse);
        else this.setKey(key, true);
      });
      if (key !== 'reverse') {
        const up = (e) => { e.preventDefault(); this.setKey(key, false); };
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
        el.addEventListener('lostpointercapture', up);
      }
    });
    document.querySelectorAll('[data-act]').forEach((el) =>
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); this.emit(el.dataset.act); }));

    const map = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'gas', KeyW: 'gas',
      ArrowDown: 'brake', ShiftLeft: 'brake', ShiftRight: 'brake', Space: 'handbrake' };
    addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (map[e.code]) { this.setKey(map[e.code], true); e.preventDefault(); }
      else if (e.code === 'KeyC') this.emit('camera');
      else if (e.code === 'KeyR') this.setKey('reverse', !this.state.reverse);
      else if (e.code === 'KeyT') this.emit('reset');
    });
    addEventListener('keyup', (e) => { if (map[e.code]) this.setKey(map[e.code], false); });
    addEventListener('blur', () => this.releaseAll());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.releaseAll(); });

    // block scrolling / context menu / pinch
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('gesturestart', (e) => e.preventDefault());

    // drag on the 3D view = look around
    let id = null, lx = 0, ly = 0;
    canvas.addEventListener('pointerdown', (e) => { id = e.pointerId; lx = e.clientX; ly = e.clientY; this.look.active = true; canvas.setPointerCapture(id); });
    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      this.look.yaw = Math.max(-1.8, Math.min(1.8, this.look.yaw - (e.clientX - lx) * 0.005));
      this.look.pitch = Math.max(-0.5, Math.min(0.5, this.look.pitch - (e.clientY - ly) * 0.004));
      lx = e.clientX; ly = e.clientY;
    });
    const end = (e) => { if (e.pointerId === id) { id = null; this.look.active = false; } };
    canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  }

  setKey(k, v) {
    this.state[k] = v;
    const b = this.buttons[k]; if (b) b.classList.toggle('on', v);
  }
  releaseAll() { for (const k of Object.keys(this.state)) if (k !== 'reverse') this.setKey(k, false); }
  on(act, fn) { this.handlers[act] = fn; }
  emit(act) { if (this.handlers[act]) this.handlers[act](); }
}

// ---- game/CameraManager

const MODES = ['Cockpit', 'Front', 'Chase', 'Side'];
const FLIP = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI); // camera looks -Z, bus faces +Z
const _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _e = new THREE.Euler();

class CameraManager {
  constructor(camera, onChange) {
    this.camera = camera; this.mode = 2; this.onChange = onChange;
    this.camHeading = 0; this.initialised = false;
  }
  get name() { return MODES[this.mode]; }
  next() { this.mode = (this.mode + 1) % MODES.length; this.initialised = false; this.onChange(this.name); }

  update(bus, p, look, dt) {
    const cam = this.camera;
    // free-look returns to centre when released
    if (!look.active) { const k = Math.min(1, dt * 3); look.yaw -= look.yaw * k; look.pitch -= look.pitch * k; }
    bus.root.updateMatrixWorld(true);
    let fov = 65;

    if (this.mode === 0 || this.mode === 1) {            // cockpit / front: rigidly attached to body (no jitter)
      const local = this.mode === 0 ? _v.set(-0.7, 2.45, 3.4) : _v.set(0, 1.3, 5.9);
      cam.position.copy(bus.body.localToWorld(local));
      bus.body.getWorldQuaternion(_q);
      cam.quaternion.copy(_q).multiply(FLIP);
      if (this.mode === 0) { _e.set(look.pitch, look.yaw, 0, 'YXZ'); cam.quaternion.multiply(_q.setFromEuler(_e)); }
      fov = this.mode === 0 ? 75 : 70;
    } else if (this.mode === 2) {                        // chase: heading is smoothed, position follows rigidly
      if (!this.initialised) { this.camHeading = p.heading; this.initialised = true; }
      let d = p.heading - this.camHeading;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      this.camHeading += d * (1 - Math.exp(-dt * 3));
      const h = this.camHeading + look.yaw;
      const dist = 15, height = 5.5 - look.pitch * 6;
      cam.position.set(p.x - Math.sin(h) * dist, height, p.z - Math.cos(h) * dist);
      cam.lookAt(p.x + Math.sin(p.heading) * 6, 2.2, p.z + Math.cos(p.heading) * 6);
      fov = 60 + Math.min(12, p.kmh * 0.12);
    } else {                                             // side: attached to bus root
      cam.position.copy(bus.root.localToWorld(_v.set(10, 3, 1)));
      cam.lookAt(p.x, 1.8, p.z + Math.cos(p.heading) * 0.5);
      fov = 60;
    }
    if (Math.abs(cam.fov - fov) > 0.05) { cam.fov = fov; cam.updateProjectionMatrix(); }
  }
}

// ---- ui/HUD
class HUD {
  constructor() {
    this.spd = document.getElementById('spd');
    this.gear = document.getElementById('gear');
    this.rpm = document.getElementById('rpm');
    this.label = document.getElementById('camlabel');
    this._s = -1; this._g = ''; this._r = -1; this._t = 0;
  }
  update(p, reverse) {
    const s = Math.round(p.kmh);
    if (s !== this._s) { this._s = s; this.spd.textContent = s; }
    const g = reverse ? 'R' : (p.kmh < 1 && p.thr < 0.05 ? 'N' : String(p.gear));
    if (g !== this._g) { this._g = g; this.gear.textContent = g; }
    const r = Math.round(p.rpm * 100);
    if (r !== this._r) {
      this._r = r; this.rpm.style.width = r + '%';
      this.rpm.style.background = r > 85 ? '#ff453a' : r > 70 ? '#ffd60a' : '#4cd964';
    }
  }
  toast(text) {
    this.label.textContent = text + ' camera'; this.label.classList.add('show');
    clearTimeout(this._t); this._t = setTimeout(() => this.label.classList.remove('show'), 1200);
  }
}

// ---- game/Game

const MOBILE = /Android|iPhone|iPad|Mobi/i.test(navigator.userAgent);

class Game {
  constructor(canvas) {
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: !MOBILE, powerPreference: 'high-performance' });
    this.renderer.outputEncoding = THREE.sRGBEncoding;
    this.renderer.setPixelRatio(Math.min(devicePixelRatio || 1, MOBILE ? 1.5 : 2));

    this.scene = new THREE.Scene();
    const sky = 0xbfd8e6;
    this.scene.background = new THREE.Color(sky);
    this.scene.fog = new THREE.Fog(sky, 90, 450);
    this.scene.add(new THREE.HemisphereLight(0xdfeeff, 0x587042, 1.0));
    const sun = new THREE.DirectionalLight(0xfff2d8, 1.6); sun.position.set(-120, 200, 80); this.scene.add(sun);

    this.camera = new THREE.PerspectiveCamera(65, 1, 0.3, 700);
    this.world = new World(this.scene);
    this.bus = new Bus(); this.scene.add(this.bus.root);
    this.physics = new BusPhysics();
    this.input = new InputManager(canvas);
    this.hud = new HUD();
    this.cams = new CameraManager(this.camera, (n) => this.hud.toast(n));

    this.input.on('camera', () => this.cams.next());
    this.input.on('reset', () => { this.physics.reset(); this.input.setKey('reverse', false); });

    addEventListener('resize', () => this.resize());
    addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));
    this.resize();
    this.tick(0);                                  // draw one frame behind the menu
  }

  resize() {
    const w = innerWidth, h = innerHeight;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
  }

  start() {
    if (this.running) return;
    this.running = true; this.last = performance.now();
    const loop = (t) => { if (!this.running) return; this.tick((t - this.last) / 1000); this.last = t; requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }

  tick(dt) {
    dt = Math.min(dt, 0.05);
    if (dt > 0) {
      const p = this.physics;
      p.update(dt, this.input.state);
      p.collide(this.world.colliders, this.world.bounds);
      this.hud.update(p, this.input.state.reverse);
    }
    this.bus.sync(this.physics);
    this.cams.update(this.bus, this.physics, this.input.look, dt);
    this.renderer.render(this.scene, this.camera);
  }
}
